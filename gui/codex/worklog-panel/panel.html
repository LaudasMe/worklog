<!doctype html>
<html lang="zh-Hans" data-surface="project">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workLog</title>
<style>
  :root {
    color-scheme: light dark;
    color: var(--text);
    background: var(--page);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --text: light-dark(#25282e, #e9ebef);
    --muted: light-dark(#5d6571, #abb1bb);
    --page: light-dark(#fff, #202226);
    --surface: light-dark(#f4f5f8, #272a31);
    --pagination-surface: light-dark(#f8faff, #242a35);
    --detail-surface: light-dark(#f7f8fb, #171a1f);
    --line: light-dark(#dce0e6, #3b3f48);
    --accent: light-dark(#234d7d, #bcd5ff);
    --selected: light-dark(#edf4ff, #2a3b55);
    --selected-border: color-mix(in srgb, var(--accent) 35%, var(--line));
    --next-surface: light-dark(#eef4fc, #253347);
    --next-line: light-dark(#d3e2f4, #394c64);
    --danger: light-dark(#982f40, #f0a4ae);
    --gutter: 14px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { color: var(--text); background: var(--page); overflow-wrap: anywhere; }
  h1, h2, h3, h4, p { margin: 0; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { border: 0; background: transparent; cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }
  :is(button, summary, input, textarea, select, a):focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .icon {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .project-header {
    display: flex;
    align-items: baseline;
    gap: 5px 12px;
    flex-wrap: wrap;
    padding: 8px var(--gutter);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { font-weight: 650; }
  #project-name { padding-inline-start: 12px; border-inline-start: 1px solid var(--line); }
  .header-actions { margin-inline-start: auto; display: flex; gap: 7px; flex-wrap: wrap; }
  [data-surface="dashboard"] #check-updates, [data-surface="project"] #project-picker { display: none; }
  main { padding: 12px var(--gutter); }
  [data-surface="dashboard"] main { max-width: 1060px; margin-inline: auto; }
  body:has(#tasks-view:not([hidden])) { display: flex; flex-direction: column; height: 100dvh; }
  main:has(#tasks-view:not([hidden])) {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    width: 100%;
    overflow: auto;
  }
  #tasks-view { display: flex; flex: 1; flex-direction: column; min-height: 176px; }
  #task-list-viewport { flex: 1; min-height: 0; overflow: auto; padding-block-end: 10px; scrollbar-width: thin; }
  #task-list-viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #panel-status, .empty, .meta { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .list-header, .list-title, .list-actions, .handoff-header, .original h4, .meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #refresh-status:empty { display: none; }
  #refresh-status { margin-bottom: 8px; }
  .list-header { justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
  .list-title { gap: 8px; font-size: 18px; line-height: 1.35; font-weight: 650; }
  .list-title .icon, .handoff-icon, .original .icon { color: var(--muted); }
  .list-actions { flex-wrap: wrap; }
  #project-picker { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  select { max-width: min(220px, 55vw); }
  select, input, textarea {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 7px;
  }
  .icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    min-height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--accent);
  }
  .icon-button:not(:disabled):hover { background: var(--selected); }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 9px; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 27px;
    padding: 3px 5px;
    border: 1px solid var(--line);
    border-radius: 99px;
    color: var(--muted);
    white-space: nowrap;
    font-size: 12px;
  }
  .filter:hover { background: var(--surface); }
  .filter[aria-pressed="true"] { color: var(--accent); font-weight: 600; background: var(--selected); border-color: var(--selected-border); }
  .filter .icon { width: 12px; height: 12px; color: var(--status-color, var(--muted)); }
  .filter .count { font-size: 11px; }
  .pagination {
    display: flex;
    flex: none;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-height: 53px;
    padding: 8px 12px;
    border-block-start: 1px solid var(--line);
    background: var(--pagination-surface);
    color: var(--muted);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .pagination strong { color: var(--text); font-weight: 650; }
  .page-controls { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .page-controls .icon-button { width: 30px; min-height: 30px; border-color: var(--line); background: var(--page); }
  .page-controls .icon { width: 14px; height: 14px; }
  #previous-page .icon { transform: scaleX(-1); }
  .page-position { min-inline-size: 64px; text-align: center; }
  #tasks { display: grid; gap: 8px; }
  .group { min-width: 0; border: 1px solid var(--line); border-radius: 9px; overflow: clip; }
  .group-heading {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .group-heading .icon { width: 13px; height: 13px; color: var(--status-color, var(--muted)); }
  .group-heading .icon-chevron { width: 10px; }
  .group-heading .count { margin-inline-start: auto; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .task + .task, .group-heading + .task-rows:not(:empty) { border-top: 1px solid var(--line); }
  .group-note { padding: 8px 9px; }
  .task-heading {
    --task-prefix: 12px max(34px, var(--task-number-width)) 29px;
    --task-gap: 6px;
    display: grid;
    grid-template-columns: var(--task-prefix) minmax(0, 1fr) 68px;
    gap: var(--task-gap);
    align-items: center;
    padding-inline: 8px;
  }
  .task-toggle {
    grid-row: 1;
    grid-column: 1 / 6;
    display: grid;
    grid-template-columns: var(--task-prefix) minmax(0, 1fr) 68px;
    align-items: center;
    gap: var(--task-gap);
    width: 100%;
    min-height: 38px;
    padding: 4px 0;
    text-align: start;
  }
  .task-heading:hover, .task-heading:has([aria-expanded="true"].task-toggle) { background: var(--surface); }
  .task-heading:has([aria-expanded="true"].task-toggle) { box-shadow: inset 2px 0 var(--accent); }
  .task-toggle > .icon-chevron { width: 10px; color: var(--muted); }
  [aria-expanded="true"] > .icon-chevron { rotate: 90deg; }
  .task-number { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .task-title { grid-column: 4; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
  .task-toggle[aria-expanded="true"] .task-title { overflow-wrap: anywhere; white-space: normal; font-weight: 600; }
  .task-status {
    grid-row: 1;
    grid-column: 3;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 29px;
    min-height: 27px;
    padding: 2px;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--status-color, var(--muted));
  }
  .task-status:not(:disabled):hover, .task-status[aria-expanded="true"] { border-color: var(--line); background: var(--page); }
  .task-status:disabled { opacity: 1; }
  .task-status .icon { width: 14px; height: 14px; }
  .caret { width: 4px; height: 4px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  .task-updated {
    grid-row: 1;
    grid-column: 5;
    text-align: end;
    white-space: nowrap;
    pointer-events: none;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .task-detail { padding: 11px 10px 12px; border-top: 1px solid var(--line); background: var(--detail-surface); line-height: 1.62; }
  .facts, .task-extra { display: grid; gap: 9px; }
  .progress { padding-inline: 9px; }
  .progress-heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
  .fact-key, .handoff h3 { font-size: 12px; font-weight: 650; }
  .progress-value { margin-top: 4px; }
  .next {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto;
    gap: 7px;
    padding: 8px 9px;
    border: 1px solid var(--next-line);
    border-radius: 7px;
    background: var(--next-surface);
  }
  .next > .icon { margin-top: 2px; }
  .next :is(.fact-key, .icon) { color: var(--accent); }
  .next-value { margin-top: 1px; font-weight: 600; }
  .next[data-empty] { border-color: var(--line); background: var(--page); }
  .next[data-empty] :is(.fact-key, .icon, .next-value), .progress-value[data-empty] { color: var(--muted); }
  .next[data-empty] .next-value { font-weight: 400; }
  .next .continue-task { align-self: center; }
  .next .continue-task .icon { color: var(--accent); }
  .task-extra { margin-top: 9px; }
  .handoff, .task-sections { border: 1px solid var(--line); border-radius: 7px; background: var(--page); }
  .handoff { padding: 7px 9px 8px; }
  .handoff-header { flex-wrap: wrap; gap: 2px 7px; }
  .handoff-header .icon-button { margin-inline-start: auto; }
  .handoff-icon { display: flex; }
  .handoff-icon .icon { width: 13px; height: 13px; }
  .handoff-summary { margin-top: 3px; }
  .original { margin: 7px 0 0; max-inline-size: 42em; border-inline-start: 2px solid var(--line); padding: 7px 10px; background: var(--surface); border-radius: 0 6px 6px 0; }
  .original h4 { font-size: 12px; color: var(--muted); }
  .progress-value, .next-value, .handoff-summary, .original-text, .original-next p { white-space: pre-wrap; }
  .original-text, .original-next p { margin-top: 4px; }
  .original-next { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
  .original-next h4 { color: var(--text); }
  .task-section + .task-section, .history-entries > li + li { border-top: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  .section-toggle, .history-toggle {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px;
    min-height: 34px;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 12px;
  }
  .section-toggle:hover, .history-toggle:hover { background: var(--surface); }
  .section-toggle > .icon, .history-icon, .todo-items .icon { color: var(--muted); }
  .section-heading { font-weight: 650; }
  .history-caption { font-weight: 500; }
  .section-heading .meta { display: inline; margin-inline-start: 7px; font-weight: 400; }
  summary .icon-chevron { width: 11px; color: var(--accent); }
  details[open] > summary .icon-chevron { rotate: 90deg; }
  .section-content { padding: 0 9px 8px 26px; }
  .todo-items, .history-entries { list-style: none; margin: 0; padding: 0; }
  .todo-items li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; padding: 4px 0; }
  .todo-items li > .icon, .history-icon { margin-top: 2px; }
  .todo-status { display: inline; margin-inline-end: 6px; }
  .todo-outcome { display: block; white-space: pre-wrap; }
  .processed-toggle { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 12px; }
  .processed-toggle { min-height: 30px; }
  .history-toggle { align-items: start; padding-inline-start: 1px; }
  .history-meta { flex-wrap: wrap; gap: 2px 7px; }
  .history-kind { color: var(--text); }
  .session-items { margin: 0; padding-inline-start: 14px; }
  .source-session { overflow-wrap: anywhere; }
  .history-entry > .original { margin: 0 0 8px; }
  .text-button { color: var(--accent); display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .text-button:not(:disabled):hover { background: var(--surface); }
  .release-link { color: var(--accent); font-size: 12px; }
  .release-address { user-select: all; }
  #updates-view { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  .update-component h2 { font-size: 14px; }
  .update-component + .update-component { margin-top: 10px; }
  .update-component dl { margin: 3px 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 8px; }
  .update-component dt { color: var(--muted); font-size: 12px; }
  .update-component dd { margin: 0; }
  .tasks-empty { padding-block: 8px; }
  .tasks-empty .text-button { margin-block-start: 3px; }
  .guide-empty { max-width: 34rem; margin-inline: auto; }
  [data-surface="dashboard"] .guide-empty { margin-block-start: clamp(28px, 10vw, 74px); }
  .guide-empty h1 { font-size: clamp(20px, 3.2vw, 27px); line-height: 1.3; }
  .guide-instruction { color: var(--muted); margin-block: 8px 12px; }
  .guide-instruction strong { color: var(--text); }
  .guide-icon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); background: var(--selected); border-radius: 10px; margin-bottom: 10px; }
  .guide-icon .icon { width: 23px; height: 23px; }
  .guide-prompt { margin-bottom: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); user-select: text; }
  .guide-copy { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 10px; border-radius: 6px; background: var(--accent); color: var(--page); font-weight: 600; }
  .guide-copy:hover { background: color-mix(in srgb, var(--accent) 90%, var(--text)); }
  .guide-copy:focus-visible { outline-offset: 2px; }
  .guide-feedback { color: light-dark(#176550, #9ddfc5); font-size: 13px; }
  .guide-feedback:not(:empty) { margin-top: 6px; }
  .guide-empty + #retry-project:not([hidden]) { margin-top: 8px; }
  [data-surface="project"]:has(#empty-worklog:not([hidden])) #refresh { display: none; }
  .status-menu {
    inset: auto;
    position: fixed;
    min-width: 118px;
    max-width: calc(100% - 16px);
    margin: 0;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--page);
    color: var(--text);
    box-shadow: 0 7px 19px #11192730;
  }
  .status-menu button { display: block; width: 100%; min-height: 27px; padding: 3px 8px; border-radius: 4px; font-size: 12px; text-align: start; }
  .status-menu button:is(:hover, :focus-visible) { background: var(--surface); }
  .status-menu [data-action="cancel"] { color: var(--danger); }
  dialog {
    width: min(450px, calc(100% - 20px));
    max-height: calc(100% - 20px);
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--page);
    color: var(--text);
    box-shadow: 0 8px 30px #11192740;
  }
  dialog::backdrop { background: #11192750; }
  dialog h2 { font-size: 17px; }
  dialog form, .modal-fields { display: grid; gap: 8px; }
  .modal-fields label { display: grid; gap: 3px; font-size: 12px; font-weight: 600; }
  .modal-fields :is(select, input, textarea) { max-width: none; width: 100%; min-width: 0; font-size: 13px; font-weight: 400; }
  .modal-fields textarea { resize: vertical; }
  .modal-todos { min-width: 0; margin: 0; padding: 5px 7px 7px; border: 1px solid var(--line); border-radius: 6px; }
  .modal-todos label + label { margin-top: 6px; }
  .modal-actions { display: flex; justify-content: end; gap: 6px; }
  .action-button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .primary-button { color: var(--accent); background: var(--selected); border: 1px solid var(--selected-border); }
  .error-text { color: var(--danger); }
  .error-text:empty { display: none; }
  [data-status="TODO"] { --status-color: light-dark(#707b8c, #a4afbe); }
  [data-status="IN_PROGRESS"] { --status-color: light-dark(#2e67aa, #82b5f5); }
  [data-status="BLOCKED"] { --status-color: light-dark(#b2444a, #efa1a6); }
  [data-status="PAUSED"] { --status-color: light-dark(#966018, #efc477); }
  [data-status="DONE"] { --status-color: light-dark(#2e7458, #82d0ad); }
  [data-status="CANCELLED"] { --status-color: light-dark(#77578d, #c4a6df); }
  @media (max-width: 440px) {
    .task-heading { --task-prefix: 10px max(32px, var(--task-number-width)) 29px; --task-gap: 5px; }
    .task-heading, .task-toggle { grid-template-columns: var(--task-prefix) minmax(0, 1fr) 34px; }
    .task-clock { display: none; }
  }
  @media (max-width: 400px) {
    :root { --gutter: 10px; }
    .task-detail { padding: 9px 8px 10px; }
    .section-content { padding-inline-start: 9px; }
    .pagination { padding-inline: 8px; }
    .page-controls { gap: 3px; }
    .page-position { min-inline-size: 58px; }
  }
  @media (max-width: 345px) {
    .filters { gap: 3px; }
    .filter { padding-inline: 3px; gap: 3px; font-size: 11px; }
    .filter .icon { width: 10px; height: 10px; }
  }
  @media (pointer: coarse) {
    :is(.icon-button, .filter, .task-toggle, .task-status, .section-toggle, .history-toggle, .processed-toggle) { min-height: 44px; }
    .icon-button, .page-controls .icon-button { width: 44px; min-height: 44px; }
  }
</style>

<header class="project-header">
  <span class="wordmark">workLog</span>
  <span id="project-name" tabindex="-1" hidden></span>
  <div class="header-actions">
    <button type="button" id="refresh" class="text-button" aria-label="刷新任务列表" disabled>

        </div>

      </div>
      <div class="task-extra">
        <div class="handoff">
          <div class="handoff-header">

            <h3>上次交接</h3>

              <svg class="icon icon-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>

            <h4><svg class="icon" aria-hidden="true"><use href="#icon-file"/></svg>交接原文</h4>

<script>
  const byId = (id) => document.getElementById(id);
  const dashboard = document.documentElement.dataset.surface === "dashboard";
  const openTool = dashboard ? "open_worklog_dashboard" : "open_worklog_codex_panel";
  const panelStatus = byId("panel-status");
  const projectName = byId("project-name");
  const tasksView = byId("tasks-view");
  const refresh = byId("refresh");
  const retryProject = byId("retry-project");
  const checkUpdates = byId("check-updates");
  const updatesView = byId("updates-view");
  const updateTemplate = byId("update-template");
  const historyTemplate = byId("history-template");
  const refreshStatus = byId("refresh-status");
  const filters = byId("filters");
  const tasks = byId("tasks");
  const tasksEmpty = byId("tasks-empty");
  const taskListViewport = byId("task-list-viewport");
  const pagination = byId("pagination");
  const previousPage = byId("previous-page");
  const nextPage = byId("next-page");
  const pageSize = dashboard ? 20 : 12;
  const taskTemplate = byId("task-template");
  const projectFilter = byId("project-filter");
  const addTask = byId("add-task");
  const emptyWorklog = byId("empty-worklog");
  const statuses = new Map([
    ["active", ["未完成", "list"]],
    ["all", ["全部", "all"]],
    ["TODO", ["待开始", "todo"]],
    ["IN_PROGRESS", ["进行中", "play"]],
    ["BLOCKED", ["受阻", "blocked"]],
    ["PAUSED", ["已暂停", "paused"]],
    ["DONE", ["已完成", "done"]],
    ["CANCELLED", ["已取消", "cancelled"]],
  ]);
  const terminal = new Set(["DONE", "CANCELLED"]);
  const closedProjects = new Set();
  let allProjects = [];
  let selectedProject = "";
  let selectedStatus = dashboard ? "active" : "all";
  let currentPage = 1;
  let expandedTask = null;
  let refreshInProgress = false;
  let initializedData = false;

  const projectTarget = (project) => dashboard ? { projectId: project.id } : {};
  const taskTarget = (project, task) => ({ ...projectTarget(project), taskId: task.id });
  const taskKey = (project, task) => project.id + "/" + task.id;
  const visible = (task) => selectedStatus === "all" || task.status === selectedStatus
    || (selectedStatus === "active" && !terminal.has(task.status));
  const projectViewKey = (project) => project.state === "ready" ? project.id : "path:" + project.path;
  const scopedProjects = () => allProjects.filter((project) => !selectedProject || projectViewKey(project) === selectedProject);

  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  }

  function openedLink(response) {
    return !!response?.result && !response.result.isError;
  }

  if (dashboard) {
    projectName.textContent = "项目总览";
    projectName.hidden = false;
  }

  const historyKinds = {
    PROGRESS: ["进展", "progress"],
    HANDOFF: ["交接", "handoff"],
    DECISION: ["决策", "file"],
    BLOCKER: ["阻塞", "blocked"],
    STATUS: ["状态变更", "play"],
  };
  const todoStates = {
    OPEN: ["待处理", "todo"],
    RESOLVED: ["已解决", "done"],
    CANCELLED: ["已取消", "cancelled"],
    DISPOSED: ["已处置", "done"],
    INACTIVE: ["已失效", "paused"],
  };
  const updateStatuses = {
    update_available: "有可用更新",
    up_to_date: "已是最新正式版",
    ahead: "高于最新正式版",
    unknown: "无法判断",
  };
  const timeFormat = new Intl.DateTimeFormat("zh-CN", {
    year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  });

  const host = window.parent;
  const initializeId = 1;
  let requestId = initializeId;
  const pendingTools = new Map();
  const post = (message) => host.postMessage({ jsonrpc: "2.0", ...message }, "*");
  const timeout = window.setTimeout(() => {
    showUnavailable({message: "尚未收到 workLog 数据。请尝试重新打开面板。"});
  }, 8000);

  function icon(name) {
    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(namespace, "svg");
    svg.setAttribute("class", "icon");
    svg.setAttribute("aria-hidden", "true");
    const use = document.createElementNS(namespace, "use");
    use.setAttribute("href", "#icon-" + name);
    svg.append(use);
    return svg;
  }

  function formatTime(value) {
    let dateText = value || "";
    if (dateText && Number.isFinite(Date.parse(dateText))) {
      const parts = Object.fromEntries(
        timeFormat.formatToParts(new Date(dateText)).map(({ type, value }) => [type, value])
      );
      const year = Number(parts.year) === new Date().getFullYear() ? "" : parts.year + " 年 ";
      dateText = year + parts.month + " 月 " + parts.day + " 日 " + parts.hour + ":" + parts.minute;
    }
    return dateText;
  }

  function metadata(record) {
    return record ? [formatTime(record.at), record.client].filter(Boolean).join(" · ") : "";
  }


  function element(tag, text = "", className = "") {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function button(text, className = "text-button") {
    const node = element("button", text, className);
    node.type = "button";
    return node;
  }

  function showGuide() {
    if (emptyWorklog.hidden) emptyWorklog.querySelector(".guide-feedback")?.replaceChildren();
    emptyWorklog.hidden = false;
    if (emptyWorklog.childElementCount) return;
    const introIcon = element("div", "", "guide-icon");
    introIcon.setAttribute("aria-hidden", "true");
    introIcon.append(icon("folder"));
    const heading = element("h1", dashboard ? "添加第一个项目" : "当前聊天未找到 workLog 项目");
    const instruction = element("p", dashboard
      ? "在项目根目录打开 Codex 本地聊天，选中 "
      : "在项目管理目录的 Codex 本地聊天中，选中 ",
      "guide-instruction");
    instruction.append(element("strong", "worklog Skill"), " 后发送提示词。");
    const prompt = element("p", "请为本项目初始化worklog。", "guide-prompt");
    const copy = button("复制启用提示词", "guide-copy");
    copy.prepend(icon("copy"));
    const feedback = element("p", "", "meta guide-feedback");
    feedback.setAttribute("role", "status");
    const next = dashboard
      ? "启用后回到这里点「刷新」。"
      : "启用后在该聊天打开项目侧栏，或点「重试读取任务」。";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(prompt.textContent);
        feedback.textContent = "已复制。" + next;
      } catch {
        window.getSelection().selectAllChildren(prompt);
        feedback.textContent = "已选中提示词，请手动复制。" + next;
      }
    });
    emptyWorklog.append(introIcon, heading, instruction, prompt, copy, feedback);
  }

  function callHost(method, params, wait = 8000) {
    const id = ++requestId;
    return new Promise((resolve) => {
      const timer = window.setTimeout(() => {
        pendingTools.delete(id);
        resolve(null);
      }, wait);
      pendingTools.set(id, (result) => {
        window.clearTimeout(timer);
        resolve(result);
      });
      post({ id, method, params });
    });
  }

  async function callTool(name, args, wait) {
    const response = await callHost("tools/call", { name, arguments: args }, wait);
    if (response?.result?.structuredContent) return response.result.structuredContent;
    return { state: "unavailable", retryable: true, message: response ? "Codex 未能返回此项结果，请重试。" : "请求超时，请重试。" };
  }

  function originalLoader(original, request, emptyMessage) {
    const status = original.querySelector(".original-state");
    const text = original.querySelector(".original-text");
    const next = original.querySelector(".original-next");
    const retry = original.querySelector(".original-retry");
    let loading = false;
    let loaded = false;
    async function load() {
      if (loaded || loading) return;
      loading = true;
      status.hidden = false;
      status.textContent = "正在读取原文…";
      retry.hidden = true;
      const result = await request();
      loading = false;
      if (result?.state !== "ready" || typeof result.body !== "string") {
        status.textContent = result?.message || "无法读取原文。";
        retry.hidden = false;
        return;
      }
      loaded = true;
      status.hidden = true;
      text.textContent = result.body || emptyMessage;
      text.hidden = false;
      next.querySelector("p").textContent = result.nextStep || "";
      next.hidden = !result.nextStep;
    }
    retry.addEventListener("click", () => { void load(); });
    return load;
  }

  function renderTodo(item) {
    const entry = document.createElement("li");
    const content = document.createElement("span");
    const state = document.createElement("span");
    const [label, mark] = todoStates[item.status] || ["状态未知", "todo"];
    state.className = "meta todo-status";
    state.textContent = label;
    content.append(state, item.summary);
    if (item.outcome) {
      const outcome = document.createElement("span");
      outcome.className = "meta todo-outcome";
      outcome.textContent = item.outcome;
      content.append(outcome);
    }
    entry.append(icon(mark), content);
    return entry;
  }

  function renderHistory(project, task, record) {
    const entry = historyTemplate.content.firstElementChild.cloneNode(true);
    const details = entry.querySelector("details");
    const [label, mark] = historyKinds[record.kind] || [record.kind, "file"];
    entry.querySelector(".history-icon").append(icon(mark));
    entry.querySelector(".history-caption").textContent = record.summary;
    entry.querySelector(".history-kind").textContent = label;
    const time = entry.querySelector("time");
    time.dateTime = record.at;
    time.textContent = formatTime(record.at);
    let source = record.client || (record.source === "change" ? "workLog CLI" : "任务记录");
    if (record.projectRecord) source = record.client ? record.client + " · 项目关联记录" : "项目关联记录";
    const sourceNode = entry.querySelector(".history-source");
    sourceNode.textContent = source;
    if (record.sessionId) sourceNode.append(element("code", " · " + record.sessionId, "source-session"));
    entry.querySelector(".history-superseded").hidden = !record.superseded;
    const load = originalLoader(entry.querySelector(".original"), () => callTool("read_worklog_history", {
      ...taskTarget(project, task), source: record.source, recordId: record.id,
    }), "这条历史记录没有原文。");
    details.addEventListener("toggle", () => { if (details.open) void load(); });
    return entry;
  }

  function renderItems(container, items, render) {
    const fragment = document.createDocumentFragment();
    for (const item of items) fragment.append(render(item));
    container.replaceChildren(fragment);
  }

  function taskSectionsLoader(row, project, task) {
    const state = row.querySelector(".details-state");
    const retry = row.querySelector(".details-retry");
    const sections = row.querySelector(".task-sections");
    let loading = false;
    let loaded = false;
    async function load() {
      if (loaded || loading) return;
      loading = true;
      state.hidden = false;
      state.textContent = "正在读取待办和历史…";
      retry.hidden = true;
      const result = await callTool("read_worklog_task_sections", taskTarget(project, task));
      loading = false;
      if (result?.state !== "ready" || !result.todos || !Array.isArray(result.history)) {
        state.textContent = result?.message || "无法读取待办和历史。";
        retry.hidden = false;
        return;
      }
      const { open, processed } = result.todos;
      row.querySelector(".todo-count").textContent = "未完成 " + open.length + " 项";
      row.querySelector(".history-count").textContent = result.history.length + " 条";
      row.querySelector(".processed-count").textContent = "已处理 · " + processed.length + " 项";
      row.querySelector(".todos-empty").hidden = open.length > 0;
      row.querySelector(".history-empty").hidden = result.history.length > 0;
      row.querySelector(".processed-section").hidden = processed.length === 0;
      renderItems(row.querySelector(".open-todos"), open, renderTodo);
      renderItems(row.querySelector(".processed-todos"), processed, renderTodo);
      renderItems(row.querySelector(".history-entries"), result.history, (record) => renderHistory(project, task, record));
      const sessions = result.sessions || [];
      row.querySelector(".sessions-section").hidden = sessions.length === 0;
      row.querySelector(".sessions-count").textContent = sessions.length + " 条";
      renderItems(row.querySelector(".session-items"), sessions, (session) => {
        const item = element("li", session.client + " · ");
        item.append(element("code", session.sessionId, "source-session"));
        return item;
      });
      loaded = true;
      state.hidden = true;
      sections.hidden = false;
    }
    retry.addEventListener("click", () => { void load(); });
    return load;
  }


  function renderTask(project, task, index) {
    const row = taskTemplate.content.firstElementChild.cloneNode(true);
    const find = (selector) => row.querySelector(selector);
    const toggle = find(".task-toggle");
    const status = find(".task-status");
    const [label, statusIcon] = statuses.get(task.status) || ["未知状态", "todo"];
    const key = taskKey(project, task);
    row.dataset.status = task.status;
    row.dataset.key = key;
    find(".task-title").textContent = task.title;
    find(".task-number").textContent = task.number;
    status.append(icon(statusIcon));
    status.disabled = !project.writable;
    status.setAttribute("aria-label", task.number + " " + label + (project.writable ? "，切换状态" : ""));
    status.title = label;
    if (project.writable) {
      status.append(element("span", "", "caret"));
      status.addEventListener("click", () => openStatusMenu(project, task, status));
    }
    if (task.updatedAt && Number.isFinite(Date.parse(task.updatedAt))) {
      const parts = Object.fromEntries(timeFormat.formatToParts(new Date(task.updatedAt))
        .map(({type, value}) => [type, value]));
      const time = find(".task-updated");
      time.hidden = false;
      time.dateTime = task.updatedAt;
      time.title = formatTime(task.updatedAt);
      find(".task-day").textContent = parts.month + "/" + parts.day;
      find(".task-clock").textContent = " " + parts.hour + ":" + parts.minute;
    }

    const detail = find(".task-detail");
    const loadSections = taskSectionsLoader(row, project, task);
    detail.id = "task-detail-" + index;
    toggle.setAttribute("aria-controls", detail.id);
    const setOpen = (open) => {
      detail.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
      if (open) void loadSections();
    };
    toggle.addEventListener("click", () => {
      if (expandedTask === key) {
        expandedTask = null;
        setOpen(false);
        return;
      }
      const previous = tasks.querySelector(".task-toggle[aria-expanded='true']");
      if (previous) {
        previous.setAttribute("aria-expanded", "false");
        byId(previous.getAttribute("aria-controls")).hidden = true;
      }
      expandedTask = key;
      setOpen(true);
    });

    const progressValue = find(".progress-value");
    progressValue.textContent = task.progress?.summary || "暂无进展";
    progressValue.toggleAttribute("data-empty", !task.progress);
    const progressMeta = find(".progress-meta");
    progressMeta.textContent = metadata(task.progress);
    progressMeta.hidden = !progressMeta.textContent;
    if (task.progress?.sessionId) progressMeta.title = "来源会话 " + task.progress.sessionId;
    const next = terminal.has(task.status) ? null : task.nextStep;
    find(".next").toggleAttribute("data-empty", !next);
    find(".next-value").textContent = next || "暂无下一步";
    const continueTask = find(".continue-task");
    continueTask.hidden = terminal.has(task.status);
    continueTask.setAttribute("aria-label", "继续任务 " + task.number);
    continueTask.title = "继续任务 " + task.number;
    const continueFeedback = find(".continue-feedback");
    continueTask.addEventListener("click", async () => {
      continueTask.disabled = true;
      continueFeedback.hidden = true;
      const result = await callTool("prepare_worklog_continue", taskTarget(project, task));
      if (result?.state === "ready" && typeof result.url === "string" && result.url.startsWith("codex://threads/new?")) {
        const response = await callHost("ui/open-link", {url: result.url});
        if (!openedLink(response)) {
          continueFeedback.textContent = "Codex 未能打开新聊天。请重新读取任务后重试。";
          continueFeedback.hidden = false;
        }
      } else {
        continueFeedback.textContent = result?.message || "无法准备新聊天，请重试。";
        continueFeedback.hidden = false;
      }
      continueTask.disabled = false;
    });

    const handoffEntry = task.handoff;
    const originalToggle = find(".original-toggle");
    const handoffMetadata = metadata(handoffEntry);
    find(".handoff-meta").textContent = handoffMetadata;
    find(".handoff-meta").hidden = !handoffMetadata;
    if (handoffEntry?.sessionId) find(".handoff-meta").title = "来源会话 " + handoffEntry.sessionId;
    find(".handoff-summary").textContent = handoffEntry ? handoffEntry.summary || "暂无交接摘要" : "暂无交接记录";
    originalToggle.hidden = !handoffEntry;
    if (handoffEntry) {
      const original = find(".handoff .original");
      original.id = "handoff-original-" + index;
      originalToggle.setAttribute("aria-controls", original.id);
      const loadOriginal = originalLoader(original, () =>
        callTool("read_worklog_codex_handoff", { ...taskTarget(project, task), entryId: handoffEntry.id }),
        "这条交接没有记录原文。");
      originalToggle.addEventListener("click", () => {
        original.hidden = !original.hidden;
        originalToggle.setAttribute("aria-expanded", String(!original.hidden));
        const action = original.hidden ? "查看交接原文" : "收起交接原文";
        originalToggle.setAttribute("aria-label", action);
        originalToggle.title = action;
        if (!original.hidden) void loadOriginal();
      });
    }
    setOpen(expandedTask === key);
    return row;
  }

  function renderList(targetTask = null) {
    closeStatusMenu();
    const scopes = scopedProjects();
    const available = scopes.flatMap((project) => project.tasks || []);
    const counts = new Map([["all", available.length], ["active", 0]]);
    for (const task of available) {
      counts.set(task.status, (counts.get(task.status) || 0) + 1);
      if (!terminal.has(task.status)) counts.set("active", counts.get("active") + 1);
    }
    if (!scopes.some((project) => project.tasks?.some((task) => visible(task) && taskKey(project, task) === expandedTask))) {
      expandedTask = null;
    }
    filters.replaceChildren();
    for (const [key, [label, statusIcon]] of statuses) {
      if (!dashboard && key === "active") continue;
      const filter = button("", "filter");
      filter.dataset.status = key;
      filter.setAttribute("aria-pressed", String(key === selectedStatus));
      filter.setAttribute("aria-controls", "tasks");
      filter.append(icon(statusIcon), label, element("span", String(counts.get(key) || 0), "count"));
      filter.addEventListener("click", () => {
        if (selectedStatus !== key) {
          selectedStatus = key;
          renderFirstPage();
        }
        focusFilter();
      });
      filters.append(filter);
    }

    const statusOrder = ["IN_PROGRESS", "BLOCKED", "TODO", "PAUSED", "DONE", "CANCELLED"];
    const groups = dashboard
      ? scopes.map((project) => ({project, status: null, list: (project.tasks || []).filter(visible)}))
      : statusOrder.map((status) => ({
        project: scopes[0], status, list: available.filter((task) => task.status === status && visible(task)),
      })).filter(({list}) => list.length > 0);
    const total = groups.reduce((count, {list}) => count + list.length, 0);
    const pageCount = Math.max(1, Math.ceil(total / pageSize));
    const oldPage = currentPage;
    if (targetTask) {
      const targetIndex = groups.flatMap(({project, list}) => list.map((task) => taskKey(project, task))).indexOf(targetTask);
      if (targetIndex !== -1) currentPage = Math.floor(targetIndex / pageSize) + 1;
    }
    currentPage = Math.max(1, Math.min(currentPage, pageCount));
    const pageStart = (currentPage - 1) * pageSize;
    const pageEnd = Math.min(pageStart + pageSize, total);

    tasks.replaceChildren();
    const idLength = available.reduce((longest, task) => Math.max(longest, task.number.length), 0);
    tasks.style.setProperty("--task-number-width", idLength * 7 + "px");
    let index = 0;
    function group(status, project, list, groupCount) {
      const name = dashboard ? projectLabel(project) : statuses.get(status)[0];
      const key = projectViewKey(project);
      const mark = dashboard ? "folder" : statuses.get(status)[1];
      const wrapper = element(dashboard ? "details" : "section", "", "group");
      const heading = element(dashboard ? "summary" : "h2", "", "group-heading");
      if (dashboard) heading.append(chevron());
      else wrapper.dataset.status = status;
      heading.append(icon(mark), element("span", name), element("span", groupCount + (dashboard ? "" : " 项"), "count"));
      wrapper.append(heading);
      if (dashboard) {
        wrapper.open = !closedProjects.has(key);
        wrapper.addEventListener("toggle", () => {
          if (!wrapper.isConnected) return;
          if (wrapper.open) closedProjects.delete(key);
          else closedProjects.add(key);
        });
      }
      const rows = element("div", "", "task-rows");
      if (project.state !== "ready") rows.append(element("p", project.message || "无法读取此项目。请检查登记后刷新。", "group-note empty"));
      else if (list.length === 0) rows.append(element("p",
        project.tasks.length ? "该筛选范围内暂无任务。" : "此项目还没有任务。", "group-note empty"));
      else for (const task of list) rows.append(renderTask(project, task, index++));
      wrapper.append(rows);
      return wrapper;
    }
    let groupStart = 0;
    for (const {status, project, list} of groups) {
      const rows = list.slice(Math.max(0, pageStart - groupStart), Math.max(0, pageEnd - groupStart));
      // 保留空项目或无法读取项目的提示，不占任务名额。
      const emptyGroupPage = Math.min(pageCount, Math.floor(groupStart / pageSize) + 1);
      if (rows.length || (!list.length && currentPage === emptyGroupPage)) {
        tasks.append(group(status, project, rows, list.length));
      }
      groupStart += list.length;
    }
    pagination.hidden = total === 0;
    previousPage.disabled = currentPage <= 1;
    nextPage.disabled = currentPage >= pageCount;
    byId("page-range").textContent = total ? (pageStart + 1) + "–" + pageEnd : "";
    byId("page-task-count").textContent = total;
    byId("page-number").textContent = currentPage;
    byId("page-count").textContent = pageCount;
    if (currentPage !== oldPage) taskListViewport.scrollTop = 0;
    const visibleCount = counts.get(selectedStatus) || 0;
    const hasReadableProjects = scopes.some((project) => project.state === "ready");
    const filterEmpty = hasReadableProjects && visibleCount === 0 && available.length > 0;
    tasksEmpty.hidden = !filterEmpty && (dashboard || available.length > 0);
    byId("empty-tasks-message").textContent = filterEmpty ? "当前筛选下暂无任务。" : "此项目还没有任务。";
    byId("show-all").hidden = !filterEmpty || selectedStatus === "all";
    addTask.disabled = !allProjects.some((project) => project.writable);
  }

  function renderFirstPage() {
    currentPage = 1;
    renderList();
    taskListViewport.scrollTop = 0;
  }

  function turnPage(delta, origin, other) {
    currentPage += delta;
    renderList();
    taskListViewport.scrollTop = 0;
    if (origin.disabled) other.focus({preventScroll: true});
  }

  function chevron() {
    const mark = icon("chevron");
    mark.classList.add("icon-chevron");
    return mark;
  }

  function focusFilter() {
    filters.querySelector('[aria-pressed="true"]')?.focus();
  }

  function showUnavailable(result) {
    tasksView.hidden = true;
    if (!dashboard) projectName.hidden = true;
    retryProject.hidden = dashboard;
    if (!dashboard && result?.code === "not_initialized") {
      panelStatus.hidden = true;
      showGuide();
      return;
    }
    emptyWorklog.hidden = true;
    panelStatus.textContent = result?.message || "无法读取 workLog 任务，请重试。";
    panelStatus.hidden = false;
  }

  function projectLabel(project) {
    const name = project.projectName || project.path;
    const sharedName = allProjects.some((other) => other !== project && (other.projectName || other.path) === name);
    return dashboard && sharedName ? name + " · " + project.path : name;
  }

  function projectOptions(select, projects, placeholder, selected = "") {
    const list = [new Option(placeholder, "")];
    for (const project of projects) list.push(new Option(projectLabel(project), projectViewKey(project)));
    select.replaceChildren(...list);
    select.value = selected;
  }

  function acceptView(result, targetTask) {
    window.clearTimeout(timeout);
    initializedData = true;
    if (result?.state !== "ready") {
      showUnavailable(result);
      return false;
    }
    if (dashboard ? !Array.isArray(result.projects) : !Array.isArray(result.tasks)) {
      showUnavailable({message: "Codex 返回的任务数据格式不正确。请尝试重新打开面板。"});
      return false;
    }
    allProjects = dashboard ? result.projects : [result];
    panelStatus.hidden = true;
    retryProject.hidden = true;
    if (allProjects.length === 0) {
      tasksView.hidden = true;
      showGuide();
      return true;
    }
    emptyWorklog.hidden = true;
    if (dashboard) {
      if (selectedProject && !allProjects.some((project) => projectViewKey(project) === selectedProject)) {
        selectedProject = "";
        currentPage = 1;
        taskListViewport.scrollTop = 0;
      }
      projectOptions(projectFilter, allProjects, "全部项目", selectedProject);
    } else {
      projectName.textContent = result.projectName;
      projectName.hidden = false;
    }
    tasksView.hidden = false;
    renderList(targetTask);
    return true;
  }

  async function refreshProject(feedback = "已刷新任务。", targetTask) {
    if (refreshInProgress) return false;
    const fromGuide = !emptyWorklog.hidden;
    refreshInProgress = true;
    refresh.disabled = true;
    retryProject.disabled = true;
    if (tasksView.hidden) panelStatus.hidden = true;
    refreshStatus.textContent = "正在刷新任务…";
    const result = await callTool(openTool, {});
    const ok = acceptView(result, targetTask);
    refreshInProgress = false;
    refresh.disabled = false;
    retryProject.disabled = false;
    if (feedback === "已刷新任务。") {
      if (!ok || allProjects.length === 0) feedback = "";
      else if (fromGuide && allProjects.length === 1) feedback = "读取到「" + projectLabel(allProjects[0]) + "」。";
    }
    refreshStatus.textContent = feedback;
    return ok;
  }

  refresh.addEventListener("click", () => { void refreshProject(); });
  retryProject.addEventListener("click", async () => {
    if (await refreshProject() && !projectName.hidden) projectName.focus();
  });
  previousPage.addEventListener("click", () => turnPage(-1, previousPage, nextPage));
  nextPage.addEventListener("click", () => turnPage(1, nextPage, previousPage));
  taskListViewport.addEventListener("scroll", closeStatusMenu);
  projectFilter.addEventListener("change", () => {
    if (selectedProject === projectFilter.value) return;
    selectedProject = projectFilter.value;
    renderFirstPage();
  });
  byId("show-all").addEventListener("click", () => {
    selectedStatus = "all";
    renderFirstPage();
    focusFilter();
  });

  const actions = {
    start: ["开始", "task-start"],
    pause: ["暂停", "task-pause"],
    resume: ["恢复", "task-resume"],
    complete: ["完成", "task-complete"],
    cancel: ["取消任务", "task-cancel"],
    reopen: ["重新打开", "task-reopen"],
    setBlocker: ["设为受阻", "blocker-set"],
    resolveBlocker: ["解除阻塞", "blocker-resolve"],
  };
  const allowed = {
    TODO: ["start", "setBlocker", "complete", "cancel"],
    IN_PROGRESS: ["pause", "setBlocker", "complete", "cancel"],
    PAUSED: ["resume", "complete", "cancel"],
    DONE: ["reopen"],
    CANCELLED: ["reopen"],
  };
  const menu = byId("status-menu");
  const dialog = byId("task-dialog");
  const dialogFields = byId("dialog-fields");
  const form = byId("task-form");
  const submitButton = byId("dialog-submit");
  const closeButton = byId("dialog-close");
  const dialogError = byId("dialog-error");
  let menuTrigger;
  let confirmAction;
  let pendingWrite;
  let isWriting = false;

  function dismissWhenOutside(event) {
    if (menuTrigger && !menu.contains(event.target) && !menuTrigger.contains(event.target)) closeStatusMenu();
  }
  document.addEventListener("pointerdown", dismissWhenOutside);
  document.addEventListener("focusin", dismissWhenOutside);
  window.addEventListener("resize", closeStatusMenu);
  menu.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      const trigger = menuTrigger;
      closeStatusMenu();
      trigger?.focus();
      event.preventDefault();
      return;
    }
    if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
    event.preventDefault();
    const choices = [...menu.querySelectorAll("button")];
    const current = choices.indexOf(document.activeElement);
    const step = event.key === "ArrowUp" ? -1 : 1;
    const index = event.key === "Home" ? 0 : event.key === "End" ? choices.length - 1
      : (current + step + choices.length) % choices.length;
    choices[index]?.focus();
  });

  function closeStatusMenu() {
    if (menu.matches(":popover-open")) menu.hidePopover();
    menuTrigger?.setAttribute("aria-expanded", "false");
    menuTrigger = undefined;
  }

  function openStatusMenu(project, task, trigger) {
    if (isWriting || refreshInProgress) return;
    const wasOpen = menuTrigger === trigger && menu.matches(":popover-open");
    closeStatusMenu();
    if (wasOpen) return;
    const choices = [...(allowed[task.lifecycle] || [])];
    if (task.status === "BLOCKED" || (task.lifecycle === "PAUSED" && task.blocked)) {
      choices.splice(choices.indexOf("complete"), 0, "resolveBlocker");
    }
    if (!choices.length) return;
    menu.replaceChildren();
    for (const action of choices) {
      const item = button(actions[action][0], "");
      item.dataset.action = action;
      item.addEventListener("click", () => {
        closeStatusMenu();
        trigger.focus();
        if (action === "complete") void openCompletion(project, task);
        else if (action === "setBlocker" || action === "resolveBlocker") void openBlocker(project, task, action);
        else if (action === "cancel" || action === "reopen") openReason(project, task, action);
        else void mutate(project, task, actions[action][1], {});
      });
      menu.append(item);
    }
    menuTrigger = trigger;
    trigger.setAttribute("aria-expanded", "true");
    const anchor = trigger.getBoundingClientRect();
    menu.showPopover();
    const margin = 6;
    const x = Math.min(anchor.left, window.innerWidth - menu.offsetWidth - margin);
    const y = anchor.bottom + menu.offsetHeight + margin > window.innerHeight
      ? Math.max(margin, anchor.top - menu.offsetHeight - 3) : anchor.bottom + 3;
    menu.style.left = Math.max(margin, x) + "px";
    menu.style.top = y + "px";
    menu.querySelector("button")?.focus();
  }

  function resetDialog(title, submission, target = "") {
    confirmAction = undefined;
    pendingWrite = undefined;
    dialogFields.replaceChildren();
    dialogError.textContent = "";
    byId("dialog-heading").textContent = title;
    byId("dialog-target").textContent = target;
    submitButton.textContent = submission;
    submitButton.disabled = false;
    closeButton.disabled = false;
    dialog.showModal();
  }

  function labeled(label, control) {
    const field = element("label", label);
    field.append(control);
    return field;
  }

  function addDialog() {
    if (isWriting || refreshInProgress) return;
    const writable = allProjects.filter((project) => project.writable);
    if (!writable.length) return;
    resetDialog("添加任务", "添加");
    const select = element("select");
    if (dashboard) {
      const preselected = writable.some((project) => projectViewKey(project) === selectedProject) ? selectedProject : "";
      projectOptions(select, writable, "请选择项目", preselected);
      dialogFields.append(labeled("所属项目", select));
    }
    const title = element("input");
    title.type = "text";
    dialogFields.append(labeled("任务标题", title));
    (dashboard && !select.value ? select : title).focus();
    confirmAction = () => {
      const project = dashboard ? writable.find((item) => projectViewKey(item) === select.value) : writable[0];
      if (!project) return invalid("请选择所属项目。", select);
      const value = title.value.trim();
      if (!value) return invalid("请填写任务标题。", title);
      return mutate(project, null, "task-create", {title: value});
    };
  }

  function taskLabel(project, task) {
    return projectLabel(project) + " · " + task.number + " " + task.title;
  }

  function openReason(project, task, action) {
    const [label, command] = actions[action];
    resetDialog(label, action === "cancel" ? "确认取消任务" : "确认重新打开", taskLabel(project, task));
    const input = element("textarea");
    input.rows = 3;
    dialogFields.append(labeled("原因", input));
    input.focus();
    confirmAction = () => {
      const reason = input.value.trim();
      if (!reason) return invalid("请填写原因。", input);
      return mutate(project, task, command, {reason});
    };
  }

  async function openBlocker(project, task, action) {
    const [label, command] = actions[action];
    const resolving = action === "resolveBlocker";
    resetDialog(label, resolving ? "确认解除" : "确认设置", taskLabel(project, task));
    submitButton.disabled = true;
    const loading = element("p", "正在核对任务和接手状态…", "meta");
    dialogFields.append(loading);
    closeButton.focus();
    const result = await callTool("read_worklog_blocker_options", {
      ...taskTarget(project, task), expectedRevision: task.revision,
    });
    if (!dialog.open || !loading.isConnected) return;
    loading.remove();
    if (result.state !== "ready") {
      dialogError.textContent = result.message;
      const reload = button("刷新任务");
      reload.addEventListener("click", async () => {
        dialog.close();
        await refreshProject();
        focusAfterWrite(project, task.id);
      });
      dialogFields.append(reload);
      return;
    }
    const guards = {expected_context_position: result.contextPosition};
    if (result.runId) guards.run_id = result.runId;
    const primary = element(resolving ? "select" : "textarea");
    const explanation = element("textarea");
    explanation.rows = 3;
    if (resolving) {
      if (!result.blockers.length) {
        dialogError.textContent = "任务已没有生效阻塞。请刷新列表。";
        return;
      }
      for (const blocker of result.blockers) {
        const caption = [blocker.summary, metadata(blocker)].filter(Boolean).join(" · ");
        primary.add(new Option(caption, blocker.id));
      }
      const affected = element("p", "", "meta");
      const condition = element("p", "", "meta");
      const showCondition = () => {
        const selected = result.blockers.find((item) => item.id === primary.value);
        affected.textContent = selected && selected.blockedWork !== selected.summary ? "受阻事项：" + selected.blockedWork : "";
        affected.hidden = !affected.textContent;
        condition.textContent = selected ? "解除条件：" + selected.unblockCondition : "";
      };
      primary.addEventListener("change", showCondition);
      showCondition();
      dialogFields.append(labeled("要解除的阻塞", primary), affected, condition, labeled("解除说明", explanation));
    } else {
      primary.rows = 3;
      dialogFields.append(labeled("受阻事项及原因", primary), labeled("解除条件", explanation));
    }
    submitButton.disabled = false;
    primary.focus();
    confirmAction = () => {
      const work = primary.value.trim();
      const reason = explanation.value.trim();
      if (!work) return invalid(resolving ? "请选择要解除的阻塞。" : "请填写受阻事项及原因。", primary);
      if (!reason) return invalid(resolving ? "请填写解除说明。" : "请填写解除条件。", explanation);
      const fields = resolving ? {blocker_id: work, outcome_md: reason} : {blocked_work: work, unblock_condition: reason};
      return mutate(project, task, command, {...guards, ...fields});
    };
  }

  async function openCompletion(project, task) {
    resetDialog("完成任务", "确认完成", taskLabel(project, task));
    submitButton.disabled = true;
    const loading = element("p", "正在读取完成依据和待办…", "meta");
    dialogFields.append(loading);
    closeButton.focus();
    const result = await callTool("read_worklog_completion_options", {
      ...taskTarget(project, task), expectedRevision: task.revision,
    });
    if (!dialog.open || !loading.isConnected) return;
    if (result.state !== "ready") {
      if (result.retryable) {
        const retry = button("重试读取完成依据");
        retry.addEventListener("click", () => {
          dialog.close();
          void openCompletion(project, task);
        });
        loading.replaceChildren(retry);
        dialogError.textContent = result.message;
        retry.focus();
      } else {
        dialog.close();
        await refreshProject(result.message);
        focusAfterWrite(project, task.id);
      }
      return;
    }
    loading.remove();
    const scope = element("textarea");
    scope.rows = 2;
    scope.value = result.completedScope;
    const evidence = element("select");
    if (!result.evidence.length) evidence.add(new Option("暂无符合规则的已保存进展或交接", ""));
    for (const [index, record] of result.evidence.entries()) {
      const caption = [record.label, record.summary, metadata(record)].filter(Boolean).join(" · ");
      evidence.add(new Option(caption, String(index)));
    }
    dialogFields.append(labeled("完成范围", scope), labeled("完成依据", evidence));
    const inputs = new Map();
    if (result.todos.length) {
      const todos = element("fieldset", "", "modal-todos");
      todos.append(element("legend", "开放待办及处置"));
      for (const todo of result.todos) {
        const input = element("textarea");
        input.rows = 2;
        todos.append(labeled(todo.summary, input));
        inputs.set(todo.id, input);
      }
      if (inputs.size > 1) {
        const fill = button("将首条说明填入其他空项");
        fill.addEventListener("click", () => {
          const [first, ...rest] = inputs.values();
          const description = first.value.trim();
          if (description) for (const field of rest) {
            if (!field.value.trim()) field.value = description;
          }
        });
        todos.append(fill);
      }
      dialogFields.append(todos);
    }
    if (result.blockers.length) {
      dialogError.textContent = "未解除的任务级阻塞：" + result.blockers.map((item) => item.summary).join("、");
    } else if (!result.evidence.length) {
      dialogError.textContent = "请先保存至少一条符合完成规则的进展或交接。";
    } else {
      submitButton.disabled = false;
    }
    scope.focus();
    confirmAction = () => {
      const completedScope = scope.value.trim();
      if (!completedScope) return invalid("请填写完成范围。", scope);
      const record = evidence.value !== "" && result.evidence[Number(evidence.value)];
      if (!record) return invalid("请选择有效的完成依据。", evidence);
      const dispositions = {};
      for (const [id, input] of inputs) {
        const text = input.value.trim();
        if (!text) return invalid("请填写每条开放待办的处置说明。", input);
        dispositions[id] = text;
      }
      return mutate(project, task, "task-complete", {
        completed_scope: completedScope, evidence: [record.ref], todo_dispositions: dispositions,
      });
    };
  }

  function invalid(message, control) {
    dialogError.textContent = message;
    control.focus();
  }

  function operationId() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 15) | 64;
    bytes[8] = (bytes[8] & 63) | 128;
    const hex = Array.from(bytes, (n) => n.toString(16).padStart(2, "0")).join("");
    return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
  }

  function mutate(project, task, command, fields) {
    const request = {
      operation_id: operationId(),
      project_id: project.id,
      data_generation: project.generation,
      ...fields,
    };
    if (task) {
      request.task_id = task.id;
      request.expected_revision = task.revision;
    }
    return sendWrite({project, task, command, request});
  }

  function focusAfterWrite(project, id) {
    const row = tasks.querySelector('.task[data-key="' + CSS.escape(project.id + "/" + id) + '"]');
    const status = row?.querySelector(".task-status");
    if (status && !status.disabled && status.offsetParent) status.focus();
    else if (tasksView.hidden) refresh.focus();
    else focusFilter();
  }

  async function sendWrite(write) {
    if (isWriting || refreshInProgress) return;
    isWriting = true;
    refresh.disabled = true;
    const {project, task, command, request} = write;
    if (dialog.open) {
      submitButton.disabled = true;
      closeButton.disabled = true;
      dialogError.textContent = "";
    } else {
      refreshStatus.textContent = "正在保存任务…";
    }
    const result = await callTool("mutate_worklog_task", {...projectTarget(project), command, request}, 15000);
    isWriting = false;
    refresh.disabled = false;
    if (result.state !== "ready" && result.retryable) {
      if (dialog.open) {
        pendingWrite = write;
        dialogError.textContent = result.message;
        for (const control of dialogFields.querySelectorAll("input, textarea, select, button")) control.disabled = true;
        submitButton.disabled = false;
        submitButton.textContent = "重试原请求";
        closeButton.disabled = false;
        submitButton.focus();
      } else {
        refreshStatus.textContent = result.message + " ";
        const retry = button("重试原请求");
        retry.addEventListener("click", () => { void sendWrite(write); });
        refreshStatus.append(retry);
        retry.focus();
      }
      return;
    }
    pendingWrite = undefined;
    if (dialog.open) dialog.close();
    const newTask = result.task;
    if (result.state === "ready" && command === "task-create" && newTask) {
      if (!["all", "active", "TODO"].includes(selectedStatus)) selectedStatus = dashboard ? "active" : "TODO";
      if (selectedProject) selectedProject = projectViewKey(project);
      closedProjects.delete(projectViewKey(project));
    }
    const feedback = result.state === "ready"
      ? command === "task-create" && newTask ? "已添加 " + newTask.number + "。"
        : command === "blocker-set" ? "已设置阻塞。"
        : command === "blocker-resolve" ? "已解除所选阻塞。" : "已保存任务状态。"
      : result.message || "任务写入失败。";
    const updatedTask = newTask || task;
    const targetTask = result.state === "ready" && updatedTask ? taskKey(project, updatedTask) : null;
    await refreshProject(feedback, targetTask);
    focusAfterWrite(project, updatedTask?.id);
  }

  addTask.addEventListener("click", addDialog);
  closeButton.addEventListener("click", () => dialog.close());
  dialog.addEventListener("cancel", (event) => {
    if (isWriting) event.preventDefault();
  });
  dialog.addEventListener("close", () => {
    if (dialog.open) return;
    confirmAction = undefined;
    if (!pendingWrite) return;
    pendingWrite = undefined;
    void refreshProject();
  });
  function submitDialog() {
    if (isWriting || submitButton.disabled) return;
    if (pendingWrite) void sendWrite(pendingWrite);
    else void confirmAction?.();
  }
  submitButton.addEventListener("click", submitDialog);
  form.addEventListener("submit", (event) => event.preventDefault());
  form.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing && event.target === dialogFields.querySelector("input")) {
      event.preventDefault();
      submitDialog();
    }
  });

  function createUpdateRow(component, title) {
    const row = updateTemplate.content.firstElementChild.cloneNode(true);
    const find = (selector) => row.querySelector(selector);
    const pending = find(".update-pending");
    const resultView = find(".update-result");
    const link = find(".release-link");
    const address = find(".release-address");
    const retry = find(".update-retry");
    find(".update-name").textContent = title;
    retry.setAttribute("aria-label", "重试检查 " + title);
    let loading = false;
    async function run() {
      if (loading) return;
      loading = true;
      pending.hidden = false;
      pending.textContent = "正在检查更新…";
      resultView.hidden = true;
      link.hidden = true;
      address.hidden = true;
      const result = await callTool("check_worklog_update", { component }, 25000);
      loading = false;
      pending.hidden = true;
      resultView.hidden = false;
      find(".installed-version").textContent = result?.installed_version
        || (component === "cli" ? "当前使用版本无法确认" : "无法识别");
      find(".latest-version").textContent = result?.latest_version || "暂无可确认的正式版";
      find(".update-status").textContent = updateStatuses[result?.status] || "无法判断";
      const error = result?.state === "ready" ? result.error : result?.message || "检查更新失败。";
      find(".update-error").hidden = !error;
      find(".update-error").textContent = error || "";
      retry.hidden = !error;
      const releaseUrl = result?.release_url;
      if (typeof releaseUrl === "string" && /^https:\/\/github\.com\/(?:LaudasMe|floohubAI)\/worklog\/releases\/tag\/[A-Za-z0-9.-]+$/i.test(releaseUrl)) {
        link.href = releaseUrl;
        link.hidden = false;
      }
    }
    link.addEventListener("click", async (event) => {
      event.preventDefault();
      const response = await callHost("ui/open-link", { url: link.href });
      if (!openedLink(response)) {
        address.textContent = "Codex 无法直接打开此链接。可复制地址 " + link.href;
        address.hidden = false;
      }
    });
    retry.addEventListener("click", () => { void run(); });
    return { row, run };
  }

  const updates = [
    createUpdateRow("codex", "Codex GUI"),
    createUpdateRow("cli", "CLI／Skill"),
  ];
  updatesView.append(...updates.map(({ row }) => row));
  checkUpdates.addEventListener("click", async () => {
    updatesView.hidden = false;
    checkUpdates.disabled = true;
    await Promise.all(updates.map(({ run }) => run()));
    checkUpdates.disabled = false;
  });


  window.addEventListener("message", (event) => {
    const message = event.data;
    if (event.source !== host || message?.jsonrpc !== "2.0") return;

    if (message.id === initializeId && !message.method) {
      if (message.result) {
        post({ method: "ui/notifications/initialized" });
        refresh.disabled = false;
        checkUpdates.disabled = false;
        applyTheme(message.result.hostContext?.theme);
      } else if (message.error) {
        window.clearTimeout(timeout);
        showUnavailable({message: "无法连接 Codex 面板。请尝试重新打开面板。"});
      }
      return;
    }

    if (message.id !== undefined && ["ping", "ui/resource-teardown"].includes(message.method)) {
      post({ id: message.id, result: {} });
      return;
    }

    if (message.method === "ui/notifications/tool-result") {
      window.clearTimeout(timeout);
      if (!refreshInProgress && !initializedData) acceptView(message.params?.structuredContent);
      return;
    }

    if (message.method === "ui/notifications/host-context-changed") {
      applyTheme(message.params?.theme);
      return;
    }

    if (!message.method && pendingTools.has(message.id)) {
      const finish = pendingTools.get(message.id);
      pendingTools.delete(message.id);
      finish(message);
    }
  });

  post({
    id: initializeId,
    method: "ui/initialize",
    params: {
      appInfo: { name: "worklog-codex-panel", version: "1.0.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    },
  });
</script>
</html>
